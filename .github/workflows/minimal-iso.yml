name: Minimal ISO

# Builds the SnapOS minimal USB and installs SnapOS from it by hand, typing
# the handbook's commands on its serial console: partition, format, mount,
# snapos init, choose in local.nix, snapos install. Then the installed
# system has to reach its login prompt.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ "nix/minimal.nix", "nix/minimal/**", ".github/workflows/minimal-iso.yml" ]

permissions:
  contents: write

jobs:
  minimal:
    if: github.repository == 'snapos-distro/snapos-test'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (flakes)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build the minimal ISO
        run: |
          nix build .#iso-minimal -L --print-out-paths | tail -1
          cp result/iso/*.iso snapos-minimal.iso
          ls -lh snapos-minimal.iso
      - name: Install SnapOS by hand, as the handbook says
        run: |
          sudo chmod 666 /dev/kvm
          fw=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#OVMF.fd | tail -1)/FV/OVMF.fd
          q() { nix --extra-experimental-features 'nix-command flakes' shell --inputs-from . nixpkgs#qemu --command "$@"; }
          q qemu-img create -f qcow2 disk.qcow2 20G
          q qemu-system-x86_64 -enable-kvm -m 4096 -smp 2 -bios "$fw" \
            -drive file=disk.qcow2,if=virtio -cdrom snapos-minimal.iso -boot d \
            -nic user,model=virtio-net-pci -display none \
            -serial unix:serial.sock,server,nowait -monitor unix:mon.sock,server,nowait &
          qemu=$!
          python3 - <<'PY'
          import socket, time, sys
          s = socket.socket(socket.AF_UNIX)
          for _ in range(60):
              try: s.connect("serial.sock"); break
              except OSError: time.sleep(1)
          buf = b""
          log = open("install.log", "wb")
          def read_until(token, timeout):
              global buf
              end = time.time() + timeout
              s.settimeout(5)
              while token.encode() not in buf:
                  if time.time() > end:
                      sys.stdout.write(buf[-3000:].decode(errors="replace")); raise SystemExit("timed out waiting for " + token)
                  try: d = s.recv(65536)
                  except socket.timeout: continue
                  if not d: raise SystemExit("serial closed")
                  log.write(d); log.flush(); buf += d
              i = buf.index(token.encode()); out = buf[:i]; buf = buf[i + len(token):]
              return out.decode(errors="replace")
          n = [0]
          def run(cmd, timeout=600):
              n[0] += 1
              tag = "@@STEP%d" % n[0]
              print("$ " + cmd, flush=True)
              # the quotes keep the echoed command line from matching the tag
              s.sendall((cmd + '; echo @@STEP""%d=$?\n' % n[0]).encode())
              read_until(tag + "=", timeout)
              rc = read_until("\n", 30).strip()
              print("  -> exit " + rc, flush=True)
              if rc != "0": sys.stdout.write(buf.decode(errors="replace")[-2000:]); raise SystemExit("step failed: " + cmd)
          read_until("$ ", 600)                       # the live system is up, logged in
          time.sleep(5)
          run("lsblk")
          run("sudo parted -s /dev/vda -- mklabel gpt mkpart ESP fat32 1MiB 512MiB set 1 esp on mkpart root ext4 512MiB 100%")
          run("sudo mkfs.fat -F 32 -n boot /dev/vda1 && sudo mkfs.ext4 -F -L nixos /dev/vda2")
          run("sudo udevadm settle && sudo mount /dev/disk/by-label/nixos /mnt && sudo mkdir -p /mnt/boot && sudo mount -o umask=077 /dev/disk/by-label/boot /mnt/boot")
          run("snapos init")
          run("cat /mnt/etc/snapos/local.nix")
          # the choices a person would type in nano (plus a serial console for this test)
          run("sudo sed -i -e 's/snapos.desktop = \"budgie\"/snapos.desktop = \"xfce\"/' -e 's|^}$|  boot.kernelParams = [ \"console=ttyS0,115200\" ];\\n}|' /mnt/etc/snapos/local.nix && tail -4 /mnt/etc/snapos/local.nix")
          run("sudo SNAPOS_PASSWORD=snapos snapos-install", timeout=7200)
          run("sudo umount -R /mnt && sync")
          print("installed", flush=True)
          PY
          kill $qemu; wait $qemu 2>/dev/null || true
          echo "== booting the installed system"
          q qemu-system-x86_64 -enable-kvm -m 4096 -smp 2 -bios "$fw" -drive file=disk.qcow2,if=virtio \
            -nic user,model=virtio-net-pci -display none -serial file:boot2.log -monitor unix:mon2.sock,server,nowait &
          qemu=$!
          for i in $(seq 1 120); do grep -aq 'snapos login:' boot2.log && break; sleep 5; done
          python3 -c "
          import socket,time; s=socket.socket(socket.AF_UNIX); s.connect('mon2.sock'); time.sleep(1)
          s.sendall(b'screendump installed.ppm\n'); time.sleep(3)" || true
          kill $qemu 2>/dev/null; wait $qemu 2>/dev/null || true
          tail -c 2000 boot2.log | tr -cd '[:print:]\n' | tail -15
          grep -aq 'snapos login:' boot2.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-install
          path: |
            install.log
            boot2.log
            installed.ppm
          if-no-files-found: ignore
